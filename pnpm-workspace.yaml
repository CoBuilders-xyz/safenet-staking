packages:
  - "apps/*"
  - "packages/*"

# Advisories with no patched release. decompress is reached only through
# @graphprotocol/graph-cli 0.98.1; braces through graph-cli and through @graphql-codegen/cli in
# apps/web. Both are development tooling: no built artefact contains either package.
# This list is global: pnpm ignores these CVEs on every path, including any new path that brings
# decompress or braces in later. The same advisories are dismissed in GitHub's Dependabot alerts
# with the same reasons, so the two tools agree. Before removing an entry, or when a dependency
# changes, check both the paths and the latest releases:
#   pnpm why -r decompress braces && pnpm view decompress version && pnpm view braces version
# A new path needs its own review. A release above 4.2.1 (decompress) or 3.0.3 (braces) means a
# fix exists: override to it, drop the entries here, and reopen the alerts.
auditConfig:
  ignoreCves:
    # decompress <=4.2.1, four advisories on archive extraction (path traversal, symlink chain,
    # zip slip, hardlink creation): graph-cli imports it only in command-helpers/local-node.js,
    # for `graph node install`, which no script or workflow here runs.
    - CVE-2026-53486 # GHSA-mp2f-45pm-3cg9, critical
    - CVE-2026-101894 # GHSA-hrh2-vp3x-79xf, critical
    - CVE-2026-10732 # GHSA-h39j-r5qq-r9mm, moderate
    - CVE-2026-39243 # GHSA-jwp9-9v96-94mx, moderate
    # braces <=3.0.3, stack exhaustion on deeply nested brace patterns. Under graph-cli it sits
    # below kubo-rpc-client's globSource (it-glob, fast-glob, micromatch), which graph-cli never
    # calls: it passes addAll in-memory {path, content} objects. Under @graphql-codegen/cli it
    # expands the document globs of apps/web/codegen.ts, which are committed here, not input.
    - CVE-2026-93687 # GHSA-vfj7-8cjw-p6xm, high
