name: CLI binaries

# Builds `safenet` as a standalone executable for Linux, macOS and Windows, runs each one alone
# against Mainnet, writes SHA256SUMS, and attaches all of them to the GitHub Release of the tag.
# packages/cli/scripts/build-binary.mjs explains the binary: Node's single executable
# applications, with the Node version in .nvmrc.
#
#   tag cli-v<version>                     builds, checks, and attaches to the release of the tag
#   workflow_dispatch                      builds and checks; attaches nothing
#   pull_request changing the build        builds and checks; attaches nothing
#
# The tag's version must be packages/cli's, and 0.0.0 is never released.

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cli-binaries.yml
      - packages/cli/scripts/build-binary.mjs
      - packages/cli/src/sea.ts

concurrency:
  group: cli-binaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      # Pin actions to full SHA: mutable tags can be moved to malicious code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/cli/package.json
          sparse-checkout-cone-mode: false
      - name: Check the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          release=false
          if [ "$EVENT" = push ]; then
            release=true
            if [ "${REF_NAME#cli-v}" != "$version" ]; then
              echo "::error::The tag says ${REF_NAME#cli-v} and packages/cli/package.json says $version. Tag the version the package declares."
              exit 1
            fi
            if [ "$version" = 0.0.0 ]; then
              echo "::error::Version 0.0.0 is never released. Set the version in packages/cli/package.json first."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo "## safenet $version, standalone binaries"
            echo ""
            if [ "$release" = true ]; then
              echo "Attached to the release $REF_NAME once every binary passes its checks."
            else
              echo "Trigger: $EVENT. Built and checked; nothing is attached to a release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04 }
          - { os: macos, runner: macos-15 }
          - { os: windows, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache: a cache written by another workflow could feed the build that
          # becomes the released binary.
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the binary
        run: pnpm --filter @cobuilders/safenet-cli build:binary
      # Alone in an empty directory, with no node on PATH, so it can only run as itself.
      - name: Run the binary alone against Mainnet
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node_bin="$(command -v node)"
          bin="$(ls packages/cli/binaries/safenet-*)"
          name="$(basename "$bin")"
          alone="$RUNNER_TEMP/alone"
          mkdir "$alone"
          cp "$bin" "$alone/"
          cd "$alone"
          # Without the secret, as on a pull request from a fork, the binary reads through the
          # public endpoints it carries.
          [ -n "$MAINNET_RPC_URL" ] || unset MAINNET_RPC_URL
          reported="$(PATH=/usr/bin:/bin "./$name" --version)"
          [ "$reported" = "$VERSION" ] || { echo "::error::$name reports $reported, the package $VERSION"; exit 1; }
          PATH=/usr/bin:/bin "./$name" --help > /dev/null
          PATH=/usr/bin:/bin "./$name" status --json > status.json
          staked="$("$node_bin" -p "const s = require('./status.json'); BigInt(s.totalStaked.value) > 0n ? s.block + ' ' + s.totalStaked.value : ''")"
          [ -n "$staked" ] || { echo "::error::$name status --json gave no total staked"; exit 1; }
          echo "| $name | $(wc -c < "$name" | tr -d ' ') bytes | --version $reported, --help, status --json at block ${staked% *} |" > "$RUNNER_TEMP/row.md"
          cat "$RUNNER_TEMP/row.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.os }}
          path: |
            packages/cli/binaries/safenet-*
            ${{ runner.temp }}/row.md
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: ${{ runner.temp }}/artifacts
      - name: Write SHA256SUMS
        run: |
          mkdir "$RUNNER_TEMP/release"
          find "$RUNNER_TEMP/artifacts" -type f -name 'safenet-*' -exec cp {} "$RUNNER_TEMP/release/" \;
          cd "$RUNNER_TEMP/release"
          sha256sum safenet-* > SHA256SUMS
          {
            echo "| Binary | Size | Checked |"
            echo "|---|---|---|"
            find "$RUNNER_TEMP/artifacts" -name row.md -exec cat {} \; | sort
            echo ""
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [plan, checksums]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # To create the release of the tag and attach the files.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Attach to the release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/release"
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "safenet $VERSION" \
              --notes "Standalone safenet $VERSION for Linux, macOS and Windows. Check a download against SHA256SUMS."
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber safenet-* SHA256SUMS
          echo "Attached $(find . -maxdepth 1 -name 'safenet-*' | wc -l | tr -d ' ') binaries and SHA256SUMS to $TAG." >> "$GITHUB_STEP_SUMMARY"
