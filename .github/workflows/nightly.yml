name: Nightly

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: "all: every job. web-smoke: only the production smoke suite, and the page on red."
        type: choice
        options: [all, web-smoke]
        default: all

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify-abis-deep:
    name: verify-abis-deep
    # Skipped only by a dispatch with suite web-smoke. A scheduled run has no inputs, so it runs
    # every job, as suite all does.
    if: ${{ inputs.suite != 'web-smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
    steps:
      # The deep scan reads every event from its deploy block. Public endpoints cap the
      # range and rate-limit, so a run without the archive node proves nothing. Refuse it.
      - name: Require the archive RPC
        run: |
          if [ -z "${MAINNET_RPC_URL}" ]; then
            echo "::error title=MAINNET_RPC_URL is not set::The deep ABI scan needs an archive RPC endpoint. Add the secret MAINNET_RPC_URL. Not falling back to public endpoints."
            exit 1
          fi
      # Pin actions to full SHA: mutable tags can be moved to malicious code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify every event signature from its deploy block
        run: pnpm verify:abis:deep

  test:
    name: test
    if: ${{ inputs.suite != 'web-smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Unit tests
        run: pnpm test

  # The staking flows against the real contracts on an Anvil Mainnet fork, in the interface and
  # through the CLI. Not in ci.yml: every run reads state from the archive node, which costs per
  # request.
  fork:
    name: fork
    if: ${{ inputs.suite != 'web-smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
    steps:
      # Anvil cannot serve state at a pinned block from a public endpoint. Refuse to pretend.
      - name: Require the archive RPC
        run: |
          if [ -z "${MAINNET_RPC_URL}" ]; then
            echo "::error title=MAINNET_RPC_URL is not set::The fork suite needs an archive RPC endpoint. Add the secret MAINNET_RPC_URL."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Each test reverts its Anvil snapshot, so the fork cache holds almost nothing worth keeping.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.4
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright chromium
        run: pnpm --filter @cobuilders/safenet-web exec playwright install --with-deps chromium
      # Playwright starts Anvil and the web server, and stops both when the run ends. The token
      # lets the one GitHub API request, listing SEF's proof files, skip the anonymous limit.
      - name: Fork tests, web
        id: web-fork
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @cobuilders/safenet-web test:fork
      # The five CLI writes, sent for real, then each with --dry-run. The suite starts its own
      # Anvil on 8546 and stops it when it ends. It also runs when the web suite failed, so one
      # failure does not hide the other, but not when a setup step before both failed.
      - name: Fork tests, CLI
        if: ${{ success() || steps.web-fork.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @cobuilders/safenet-cli test:fork
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-fork
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  cli-smoke:
    name: cli-smoke
    if: ${{ inputs.suite != 'web-smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
      # Raises the GitHub API limit for the commit lookup that dates SEF's participation window.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # The smoke tests skip themselves without the secret, which would report a green job that
      # tested nothing. Here a missing secret is a failure.
      - name: Require the archive RPC
        run: |
          if [ -z "${MAINNET_RPC_URL}" ]; then
            echo "::error title=MAINNET_RPC_URL is not set::The CLI smoke tests read Mainnet history and need an archive RPC endpoint. Add the secret MAINNET_RPC_URL."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run every CLI command against Mainnet
        id: cli-smoke
        run: pnpm --filter @cobuilders/safenet-cli test:smoke
      # The MCP server started over stdio, as a desktop client starts it, and called through the
      # SDK's client. It also runs when the CLI step failed, so one failure does not hide the other,
      # but not when a setup step before both failed.
      - name: Run the MCP server over stdio against Mainnet
        if: ${{ success() || steps.cli-smoke.outcome == 'failure' }}
        timeout-minutes: 10
        run: pnpm --filter @cobuilders/safenet-mcp test:smoke
      - name: Build the binary and run it
        run: |
          pnpm --filter @cobuilders/safenet-cli build
          node packages/cli/dist/index.js status

  # The production deployment as a visitor sees it, no wallet, no mocks: the index and its title,
  # the overview's total staked, the validators list, the Rewards programme section and the Safe
  # App manifest. A dispatch with suite web-smoke runs this job alone.
  web-smoke:
    name: web-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      # The suite refuses to run without the URL; this says where to set it.
      - name: Require the production URL
        run: |
          if [ -z "${PRODUCTION_URL}" ]; then
            echo "::error title=PRODUCTION_URL is not set::The production smoke suite needs the repository variable PRODUCTION_URL, the URL of the production deployment."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright chromium
        run: pnpm --filter @cobuilders/safenet-web exec playwright install --with-deps chromium
      - name: Smoke tests against production
        run: pnpm test:smoke:web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-smoke
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  # A red job here reaches a person: an issue labelled ci-red, or a comment on the open one.
  page:
    name: page
    needs: [verify-abis-deep, test, fork, cli-smoke, web-smoke]
    if: ${{ failure() }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/page-on-red.yml
    with:
      needs: ${{ toJSON(needs) }}
