name: Nightly

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify-abis-deep:
    name: verify-abis-deep
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
    steps:
      # The deep scan reads every event from its deploy block. Public endpoints cap the
      # range and rate-limit, so a run without the archive node proves nothing. Refuse it.
      - name: Require the archive RPC
        run: |
          if [ -z "${MAINNET_RPC_URL}" ]; then
            echo "::error title=MAINNET_RPC_URL is not set::The deep ABI scan needs an archive RPC endpoint. Add the secret MAINNET_RPC_URL. Not falling back to public endpoints."
            exit 1
          fi
      # Pin actions to full SHA: mutable tags can be moved to malicious code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify every event signature from its deploy block
        run: pnpm verify:abis:deep

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Unit tests
        run: pnpm test

  # The staking flows against the real contracts on an Anvil Mainnet fork. Not in ci.yml: every
  # run reads state from the archive node, which costs per request.
  fork:
    name: fork
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
    steps:
      # Anvil cannot serve state at a pinned block from a public endpoint. Refuse to pretend.
      - name: Require the archive RPC
        run: |
          if [ -z "${MAINNET_RPC_URL}" ]; then
            echo "::error title=MAINNET_RPC_URL is not set::The fork suite needs an archive RPC endpoint. Add the secret MAINNET_RPC_URL."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Each test reverts its Anvil snapshot, so the fork cache holds almost nothing worth keeping.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.4
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright chromium
        run: pnpm --filter @cobuilders/safenet-web exec playwright install --with-deps chromium
      # Playwright starts Anvil and the web server, and stops both when the run ends. The token
      # lets the one GitHub API request, listing SEF's proof files, skip the anonymous limit.
      - name: Fork tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm test:fork
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-fork
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
