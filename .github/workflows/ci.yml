name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pin actions to full SHA: mutable tags can be moved to malicious code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Restore outages can consume the job deadline before tests start.
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint and types
        run: pnpm check

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Restore outages can consume the job deadline before tests start.
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # `graph test` downloads the Matchstick binary into graph-cli's own directory when it is
      # missing. The subgraph package.json files pin its version, so they key the cache.
      - name: Cache the Matchstick binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.pnpm/@graphprotocol+graph-cli@*/node_modules/@graphprotocol/graph-cli/dist/commands/node_modules/.bin/matchstick-*
          key: matchstick-${{ runner.os }}-${{ hashFiles('packages/subgraph-mainnet/package.json', 'packages/subgraph-gnosis/package.json') }}
      # Turborepo runs `test` in every package that implements it. New packages join here
      # without a change to this file.
      - name: Unit tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm test
      # Line coverage of the CLI and the MCP server, at least 80 percent each, without the smoke
      # and fork suites, which need Mainnet. tools/run-node-tests.mjs explains the measurement.
      - name: Coverage of the CLI and the MCP server
        run: pnpm test:coverage

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Restore outages can consume the job deadline before tests start.
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright chromium
        run: pnpm --filter @cobuilders/safenet-web exec playwright install --with-deps chromium
      # The suite runs against mocked RPC. Playwright starts the Vite dev server itself, on
      # E2E_PORT or the default in apps/web/e2e/playwright.config.ts.
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  verify-abis:
    name: verify-abis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Restore outages can consume the job deadline before tests start.
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Reaches public RPC endpoints, which rate-limit. One retry after a pause absorbs that.
      # A signature that no longer matches fails both attempts, so the job still blocks.
      - name: Verify event signatures against the chain
        id: verify
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm verify:abis
      - name: Retry after a pause
        if: steps.verify.outcome == 'failure'
        timeout-minutes: 5
        run: |
          sleep 60
          pnpm verify:abis
