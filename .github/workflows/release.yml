name: Release

# Production is IPFS. This workflow builds the interface from build.env alone, packs it into a
# CAR whose CID anyone can rebuild (VERIFY.md), and pins that CAR. Vercel serves previews only.
# The ENS contenthash is not touched here.

on:
  workflow_dispatch:
    inputs:
      pin:
        description: Pin the CAR to Pinata and check that the gateways serve it. Off builds and verifies only.
        type: boolean
        default: true
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      cid: ${{ steps.cid.outputs.cid }}
    # No secret reaches this job, so none can reach the bundle it builds.
    steps:
      # Pin actions to full SHA: mutable tags can be moved to malicious code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache: a cache written by another workflow could feed the build that
          # becomes the published artifact. A fresh install from the lockfile costs a minute.
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint and types
        run: pnpm check
      # Builds with build.env only, runs the browser-safety check over dist, then writes
      # apps/web/release/app.car and apps/web/release/CID. CI has no root .env.local, so the
      # check's bundle half finds nothing to compare here. The real guarantee is that this job
      # references no secrets.* at all.
      - name: Release build, CAR and CID
        run: pnpm --filter @cobuilders/safenet-web release:build
      - name: Record the CID
        id: cid
        run: |
          cid="$(cat apps/web/release/CID)"
          echo "cid=$cid" >> "$GITHUB_OUTPUT"
          {
            echo "### Release CID"
            echo
            echo "\`$cid\`"
            echo
            echo "Built from \`$GITHUB_SHA\`. Rebuild it with the steps in VERIFY.md."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the CAR and the CID
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.cid.outputs.cid }}
          path: |
            apps/web/release/app.car
            apps/web/release/CID
          if-no-files-found: error
          retention-days: 90

  pin:
    name: pin
    needs: build
    # A tag push always pins. A manual run pins unless pin=false. Either way only from main or a
    # v* tag, so a manual run from a feature branch never pins to the production account.
    if: >-
      (github.event_name == 'push' || inputs.pin) &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache: a cache written by another workflow could feed the build that
          # becomes the published artifact. A fresh install from the lockfile costs a minute.
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the CAR and the CID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.cid }}
          path: apps/web/release
      # Fails with a clear message when either secret is empty. It never skips.
      - name: Pin to Pinata and check the gateways
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
          RELEASE_NAME: safenet-staking ${{ github.ref_name }} ${{ needs.build.outputs.cid }}
        run: pnpm --filter @cobuilders/safenet-web release:pin
