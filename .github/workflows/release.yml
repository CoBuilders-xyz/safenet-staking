name: Release

# Production is IPFS. This workflow builds the interface from build.env plus the public Graph browser key, packs it into a
# CAR whose CID anyone can rebuild (VERIFY.md), and pins that CAR. Vercel serves previews only.
# The ENS contenthash is not touched here.

on:
  workflow_dispatch:
    inputs:
      pin:
        description: Pin the CAR to Pinata and check that the gateways serve it. Off builds and verifies only.
        type: boolean
        default: true
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      cid: ${{ steps.cid.outputs.cid }}
    # Only the COB-566 public browser key reaches the build step. Private credentials stay out.
    steps:
      # Pin actions to full SHA: mutable tags can be moved to malicious code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache: a cache written by another workflow could feed the build that
          # becomes the published artifact. A fresh install from the lockfile costs a minute.
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint and types
        run: pnpm check
      # The subgraph-restricted, spending-capped browser key intentionally becomes public in the CAR.
      # The service URLs are public repository variables. Unset, the validator list reads SEF's
      # JSON and the alerts page says alerts are not configured. Change them, for example to a
      # custom domain, without a code change.
      - name: Release build, CAR and CID
        env:
          VITE_GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
          VITE_VALIDATOR_INFO_URL: ${{ vars.VITE_VALIDATOR_INFO_URL }}
          VITE_ALERTS_API_URL: ${{ vars.VITE_ALERTS_API_URL }}
        run: pnpm --filter @cobuilders/safenet-web release:build
      - name: Record the CID
        id: cid
        env:
          VITE_VALIDATOR_INFO_URL: ${{ vars.VITE_VALIDATOR_INFO_URL }}
          VITE_ALERTS_API_URL: ${{ vars.VITE_ALERTS_API_URL }}
        run: |
          cid="$(cat apps/web/release/CID)"
          echo "cid=$cid" >> "$GITHUB_OUTPUT"
          {
            echo "### Release CID"
            echo
            echo "\`$cid\`"
            echo
            echo "Built from \`$GITHUB_SHA\`. Rebuild it with the steps in VERIFY.md and these inputs:"
            echo
            echo "- \`VITE_VALIDATOR_INFO_URL=${VITE_VALIDATOR_INFO_URL}\`"
            echo "- \`VITE_ALERTS_API_URL=${VITE_ALERTS_API_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the CAR and the CID
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.cid.outputs.cid }}
          path: |
            apps/web/release/app.car
            apps/web/release/CID
          if-no-files-found: error
          retention-days: 90

  pin:
    name: pin
    needs: build
    # A tag push always pins. A manual run pins unless pin=false. Either way only from main or a
    # v* tag, so a manual run from a feature branch never pins to the production account.
    if: >-
      (github.event_name == 'push' || inputs.pin) &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache: a cache written by another workflow could feed the build that
          # becomes the published artifact. A fresh install from the lockfile costs a minute.
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the CAR and the CID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.cid }}
          path: apps/web/release
      # Fails with a clear message when either secret is empty. It never skips.
      - name: Pin to Pinata and check the gateways
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
          RELEASE_NAME: safenet-staking ${{ github.ref_name }} ${{ needs.build.outputs.cid }}
        run: pnpm --filter @cobuilders/safenet-web release:pin
