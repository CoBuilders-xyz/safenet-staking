schema: spec-driven

context: |
  Project: Safenet Beta staking interface, Track A. Monorepo, pnpm and Turborepo.
  Read docs/internal/project-context.md and docs/internal/decisions-register.md first.
  Screens are specified in docs/internal/m1-screens.md. Mapped tasks are in docs/internal/m1-tasks.md.

  Stack: React 19, Vite 7, React Router 7 with HashRouter, wagmi 3, viem 2, TanStack Query,
  Tailwind 4 with shadcn structure and our own tokens. Vitest, Playwright, Storybook.
  Subgraphs on The Graph. REST wrapper on Cloudflare Workers. Alerts on Supabase.

  Constants: every contract address, start block and event signature is imported from
  packages/core. Never write one anywhere else.

rules:
  proposal:
    - The change directory is named cob-<number>-<slug>, after its Linear issue in the COB team.
    - The proposal states the Linear issue URL on its first line.
    - One Linear issue maps to exactly one change.
    - State which packages the change may touch. Files outside those packages are out of scope.
    - Include a Non-goals section.
  specs:
    - Every requirement carries a stable identifier with a package prefix. WEB for apps/web, API for apps/api, ALR for apps/alerts, CORE for packages/core, CLI for packages/cli, MCP for packages/mcp, SUB for the subgraphs.
    - Number identifiers within a prefix and never reuse one, e.g. WEB-014.
    - Every requirement is testable. Name the observable result, not the implementation.
    - Do not write prose that asserts how an external system behaves unless a check in the repo verifies it.
  design:
    - Cite the decision identifier (D-nnn) for any choice already recorded in the register.
    - Name every data source for every displayed number, using the terms chain, subgraph, sef or derived.
  tasks:
    - Each task names the requirement identifiers it satisfies.
    - Each task includes the test that proves it.
