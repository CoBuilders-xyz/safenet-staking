<!doctype html>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://fonts.reown.com; connect-src 'self' https: http: wss: ws:; img-src 'self' data: blob: https:; frame-src 'self' https://verify.walletconnect.org https://verify.walletconnect.com; object-src 'none';" />
    <script>
      // Connect early to the location service of the access checks. The legal pages open
      // without those checks, so on them the browser does not contact the service.
      if (!/^#\/+(imprint|terms|privacy|faq)\/*(\?|$)/i.test(location.hash)) {
        var preconnect = document.createElement('link')
        preconnect.rel = 'preconnect'
        preconnect.href = 'https://api.country.is'
        preconnect.crossOrigin = 'anonymous'
        document.head.appendChild(preconnect)
      }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
