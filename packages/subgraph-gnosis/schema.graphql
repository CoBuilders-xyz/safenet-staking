# Safenet, Gnosis Chain: consensus and signing.
#
# The shape differs from the Mainnet subgraph for one reason: volume. Mainnet holds 1,835
# logs over its entire history. Gnosis emits 153,646 in two days, and roughly 15 million
# over its history. Storing a row per event is not available here.
#
# So this aggregates. Ceremonies exist only until they are counted, then they are removed.
# What survives is per-validator hourly and daily counters, which is what the promised metrics
# need: participation over a window, attestations per day, latency percentiles.
#
# Two programmes share the schema: Beta and Aegis, each on its own consensus contract and FROST
# coordinator. Every row below that counts something belongs to one programme, named in its
# `programme` field, "beta" or "aegis", and its id starts with that name. A programme's figures
# never mix with the other's: its own validator list, its own ceremonies, its own buckets.
#
# The cost of aggregating is that a new question needs a resync. On Gnosis that is expensive,
# so the aggregates below are chosen to answer every metric the interface and API are meant
# to serve, not to be minimal.

# -----------------------------------------------------------------------------------------
# Transient. These exist to join events across blocks, then they are deleted.
# -----------------------------------------------------------------------------------------

"""
A signing ceremony, held only until it can be counted.

Counting needs two facts that arrive in separate events:

  SignCompleted        gives the WINNING selectionRoot. Shares for a losing root do not
                       count, and shares are emitted BEFORE completion.
  TransactionAttested  says the ceremony was a transaction attestation. 1 ceremony in 400
                       is not, and the oracle excludes those.

Measured over 16 days to block 48,602,061: all 70,524 attestations sat in the SAME
TRANSACTION as their SignCompleted, after it. Nothing in the contract is known to enforce
that, so the handlers do not depend on the order: whichever arrives second does the counting,
and the ceremony is filed under the attestation's block either way.

Removed once counted. Without that, this table would grow by about 4,600 rows a day forever.
"""
type Ceremony @entity(immutable: false) {
  "The programme, a dash, the signature id, sid."
  id: ID!
  programme: String!

  "Set by SignCompleted. Null until then."
  winningRoot: Bytes

  "Set by TransactionAttested. A ceremony that never gets one is not counted."
  isAttestation: Boolean!

  "True once both facts are known and the counters have been updated."
  counted: Boolean!

  """
  True once this was written off as completed-without-attestation.

  Kept because the write-off is reversible: the two events sit in the same block, so
  SignCompleted may simply have run first. If an attestation then arrives, the count is
  corrected rather than double counted.
  """
  countedAsNonAttestation: Boolean!

  "Distinct selectionRoots seen for this sid, so every tally can be cleaned up."
  roots: [Bytes!]!

  firstSeenBlock: BigInt!

  """
  The block of the TransactionAttested that named this sid, and its timestamp. Null until
  then. The ceremony is filed under this block in every bucket, hourly and daily, whichever
  handler does the counting: SEF counts a ceremony in the window its attestation falls in.
  """
  attestedAtBlock: BigInt
  attestedAtTimestamp: BigInt
}

"""
A ceremony that was counted, kept for a while after its Ceremony row is removed.

A late SignShared, or a second TransactionAttested, for a counted sid would otherwise create a
new Ceremony that nothing ever completes, and openCeremonies would count it forever. The
handlers look the sid up here first and ignore the event.

Kept for COUNTED_HORIZON blocks, then removed, oldest first: the rows form a queue from
Consensus.countedOldest through `next`, so the table holds a few hundred rows, not one per
ceremony ever counted.
"""
type CountedCeremony @entity(immutable: false) {
  "The programme, a dash, the signature id, sid."
  id: ID!
  countedAtBlock: BigInt!
  "The sid counted after this one. Null for the newest."
  next: String
}

"""
Participants who shared for one sid under one selectionRoot.

Keyed by sid and root together because a ceremony can see shares for more than one root, and
only the winner counts. Removed with its ceremony.
"""
type RootTally @entity(immutable: false) {
  "The Ceremony id, a dash, selectionRoot."
  id: ID!
  ceremony: Ceremony!
  root: Bytes!
  participants: [Bytes!]!
}

"""
A proposed transaction awaiting its attestation, held to measure latency.

Latency is the block distance from TransactionProposed to TransactionAttested for the same
safeTxHash. The proposal comes first, so it must be stored until the attestation arrives.
Removed once measured.

The key repeats the indexed parameters both events carry. On Beta they are the chainId and the
Safe; on Aegis, the safeId, which packs the chain id with the Safe, and the oracle.
"""
type PendingProposal @entity(immutable: false) {
  """
  The programme, then safeTxHash and the two other indexed parameters: chainId and the Safe on
  Beta, safeId and the oracle on Aegis. Dash separated.
  """
  id: ID!
  proposedAtBlock: BigInt!
  proposedAtTimestamp: BigInt!
}

# -----------------------------------------------------------------------------------------
# What survives
# -----------------------------------------------------------------------------------------

"Network-wide totals for one programme. One row per programme, its id the programme's name."
type Consensus @entity(immutable: false) {
  id: ID!
  programme: String!

  "Ceremonies that completed AND carried an attestation. The participation denominator."
  attestationCeremonies: BigInt!

  "Ceremonies that completed without an attestation. About 1 in 400."
  nonAttestationCeremonies: BigInt!

  "TransactionAttested events seen."
  attestations: BigInt!

  "TransactionProposed events seen."
  proposals: BigInt!

  "Attestations matched to a proposal, so a latency was measurable."
  latencySamples: BigInt!

  epochRollovers: Int!
  currentEpoch: BigInt

  validatorCount: Int!

  "Ceremonies still waiting to be counted. Should stay small; a rising number means a leak."
  openCeremonies: Int!

  """
  Every signing validator seen on this programme's contracts, in the order first seen. A
  counted attestation ceremony is a miss for each of these that did not share for its winning
  root; see ValidatorHour. A validator of both programmes is in both lists, from the first time
  each programme's contracts showed it.
  """
  validators: [SigningValidator!]!

  "The oldest and the newest CountedCeremony. Null when none is kept."
  countedOldest: String
  countedNewest: String
}

"""
A validator on this chain, identified by its signing address, across both programmes. Its
counts per programme are in its days and hours, which name the programme.
"""
type SigningValidator @entity(immutable: false) {
  "The participant address, lowercase hex."
  id: ID!
  address: Bytes!

  """
  The Mainnet staker this validator signs for, from ValidatorStakerSet.

  Null when no such event has been seen. A windowed subgraph will usually see none, because
  the mapping is set once at registration and never repeated.
  """
  staker: Bytes

  """
  Winning attestation ceremonies this validator shared in, in both programmes together.

  Absences are NOT stored. The oracle derives them: absent = attestationCeremonies - attended.
  A stored counter would be a second source for the same fact and could drift from the first,
  which is the failure this project keeps finding. Both operands are here, so the subtraction
  is one step for the consumer.
  """
  attended: BigInt!

  firstSeenBlock: BigInt!

  "The latest block this validator was seen in. Never moves backwards."
  lastSeenBlock: BigInt!

  days: [ValidatorDay!]! @derivedFrom(field: "validator")
  hours: [ValidatorHour!]! @derivedFrom(field: "validator")
}

"""
Per validator, per UTC day.

This is what makes participation over 7, 30 or all days a query rather than a scan, which is
the window selector the validator detail screen is meant to offer.

Filed by the day of the block the ceremony was attested in, the same rule as ValidatorHour.
"""
type ValidatorDay @entity(immutable: false) {
  "The programme, the validator address and the UTC day start as a unix timestamp, dash separated."
  id: ID!
  programme: String!
  validator: SigningValidator!
  date: Int!

  "Derive absences as the same programme's ConsensusDay.attestationCeremonies - this."
  attended: BigInt!
}

"""
Per UTC day, network-wide.

Attestations per day is promised as a bar chart. Latency is promised as a median and a p95,
which a sum cannot give, so the samples are bucketed by block distance instead.

Every figure is filed by the day of its TransactionAttested block: an attestation ceremony
under the day it was attested in, the same rule as ConsensusHour.
"""
type ConsensusDay @entity(immutable: false) {
  "The programme, a dash, the UTC day start as a unix timestamp."
  id: ID!
  programme: String!
  date: Int!

  attestations: BigInt!
  attestationCeremonies: BigInt!

  """
  Latency in blocks, bucketed. Index n holds the count of attestations that arrived n blocks
  after their proposal, for n from 0 to 64.

  A histogram rather than raw samples because a percentile needs the distribution and there
  are about 4,600 attestations a day. 64 is the oracle's MAX_EXPECTED_LATENCY; anything
  beyond it lands in overflow and is excluded, as the oracle excludes it.
  """
  latencyBuckets: [BigInt!]!
  latencyOverflow: BigInt!
  latencySamples: BigInt!
}

# -----------------------------------------------------------------------------------------
# Hourly buckets, for SEF's window
# -----------------------------------------------------------------------------------------
#
# SEF publishes participation_rate_14d over 14 days that end at the top of an hour, both ends
# included, and counts a ceremony in the window its attestation block falls in. These rows let
# that window be summed from a current query, with no `block: { number }` back in time, which a
# pruned deployment cannot answer.
#
# A row for hour H counts the ceremonies attested in blocks with a timestamp from H up to, not
# including, H + 1 hour. The `OnTheHour` fields count the subset attested in a block whose
# timestamp is exactly H. Gnosis slots are 5 seconds and an hour is 720 of them, so most hours
# start with such a block. SEF's window from S to E, both on the hour, is then:
#
#   the sum of each field over the hours S, S + 1h, ..., E - 1h,
#   plus the `OnTheHour` field of hour E,
#
# over the rows of one programme.

"""
Per hour, network-wide: the participation denominator.
"""
type ConsensusHour @entity(immutable: false) {
  "The programme, a dash, the hour start as a unix timestamp."
  id: ID!
  programme: String!
  hour: Int!

  "Attestation ceremonies attested in this hour."
  attestationCeremonies: Int!

  "Of those, the ones attested in a block exactly on the hour."
  attestationCeremoniesOnTheHour: Int!
}

"""
Per validator, per hour: the participation numerator, and the misses beside it.

For each attestation ceremony counted in the hour, every validator in Consensus.validators at
that moment gets one ceremony, and either one attended, when it shared for the winning root,
or one missed. So `ceremonies` is always `attended + missed`; the three are written together.

A validator first seen after a ceremony was counted is not given a miss for it. SEF's
denominator is the network's: use ConsensusHour, not `ceremonies`, for a rate.
"""
type ValidatorHour @entity(immutable: false) {
  "The programme, the validator address and the hour start as a unix timestamp, dash separated."
  id: ID!
  programme: String!
  validator: SigningValidator!
  hour: Int!

  ceremonies: Int!
  attended: Int!
  missed: Int!

  "The same three, for the ceremonies attested in a block exactly on the hour."
  ceremoniesOnTheHour: Int!
  attendedOnTheHour: Int!
  missedOnTheHour: Int!
}
